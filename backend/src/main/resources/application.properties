spring.application.name=grc-score-service

# Import .env file optionally for local development
spring.config.import=optional:file:.env

# ===== DATABASE CONFIG (AWS RDS) =====
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ===== JPA / HIBERNATE =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ===== CONNECTION POOL (Hikari) =====
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
server.address=0.0.0.0

# ===== DEEPVUE GST API =====
deepvue.client-id=${DEEPVUE_CLIENT_ID}
deepvue.client-secret=${DEEPVUE_CLIENT_SECRET}
deepvue.api-key=${DEEPVUE_API_KEY}

server.port=${PORT:8080}
 
# ===== MAIL CONFIG =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
